<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100" role="img" aria-label="From idea to building to iteration">
  <defs>
    <linearGradient id="panel" x2="1" y2="0"><stop stop-color="#0C1420"/><stop offset="1" stop-color="#162539"/></linearGradient>
    <style>
      .txt{font-family:'Segoe UI',Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:2.6px;fill:#E1ECF4}
      .s{fill:#7DD3FC}
      @keyframes glow{0%,100%{opacity:.40}50%{opacity:1}}
      .blink{animation:glow 2.8s ease-in-out infinite}
      .b2{animation-delay:.9s}.b3{animation-delay:1.8s}
      @media(prefers-reduced-motion:reduce){.blink{animation:none}}
    </style>
  </defs>
  <rect width="900" height="100" rx="16" fill="url(#panel)" stroke="#344B60"/>
  <g transform="translate(42,0)">
    <circle class="s blink" cx="23" cy="50" r="7"/>
    <text class="txt" x="49" y="57">IDEA</text>
    <path d="M 215 50 H 299 l-11 -8 m11 8 l-11 8" stroke="#6DA6C8" stroke-width="1.5" fill="none"/>
    <circle class="s blink b2" cx="332" cy="50" r="7"/>
    <text class="txt" x="358" y="57">BUILD</text>
    <path d="M 522 50 H 606 l-11 -8 m11 8 l-11 8" stroke="#6DA6C8" stroke-width="1.5" fill="none"/>
    <circle class="s blink b3" cx="642" cy="50" r="7"/>
    <text class="txt" x="668" y="57">IMPROVE</text>
  </g>
</svg>